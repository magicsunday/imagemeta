  - id: DRY-1
    title: "[CRITICAL] IsoBmffParser - Extract Parse Context Object"
    labels:
      - priority:critical
      - refactoring
      - DRY
      - code-quality
      - easy-fix
    body: |
      ## Violation
      
      **File**: `src/Parse/IsoBmff/IsoBmffParser.php`
      **Pattern**: 8 parameters repeated in 11+ methods
      
      ### Problem
      ```php
      private function parseMetaBox(
          BoxDescriptor $box,
          array &$exifBlobs,
          array &$xmpBlobs,
          array &$qtKeys,
          array &$itemReferences,
          array &$dataReferences,
          array &$unresolvedItems,
          array &$xmpHashes,
          array &$qtDataAtoms = []
      ): void
      ```
      
      ### Solution
      ```php
      class IsoBmffParseContext {
          public array $exifBlobs = [];
          public array $xmpBlobs = [];
          // ... other properties
      }
      
      private function parseMetaBox(
          BoxDescriptor $box,
          IsoBmffParseContext $context
      ): void
      ```
      
      ### Effort
      2-3 days (Quick Win!)
      
