name: "Agent task"
description: "Task for agent implementation with TDD, specs, and minimal-change rules."
labels:
    - "Agent task"
    - "Needs implementation"
body:
    - type: markdown
      attributes:
          value: |
              > [!WARNING]
              > This issue is public and effectively permanent. Assume nothing you
              > paste is private, in any field — including the issue title. If you
              > meant to report a defect rather than commission one, the *Bug
              > report* and *Parse error report* forms are the ones you want;
              > [Sharing a sample file](https://github.com/magicsunday/imagemeta/blob/main/.github/SHARING-A-SAMPLE-FILE.md)
              > explains what this library reads out of a file.

              ## Agent Instructions (Read First)
              This repo is governed by `CLAUDE.md`, `AGENTS.md` (and `tests/AGENTS.md` for work under `tests/`).
              If you would need to guess, expand scope, or relax guards: **STOP** and ask.

              **Issue title:** a capitalised imperative, as the commit subject will be.

              **TDD workflow:** Write a failing test first, then implement the minimal code to make it pass.
              **Commit workflow:** work on a branch named `GH-<issue-number>` and open a pull request — never commit directly to `main`
              **Commit message:** `GH-<issue-number>: <Message starting with capital letter>` for work on this issue; see `AGENTS.md` §1.4 for the full rule
              **Close rule:** put `Closes #<issue-number>` in the pull-request body; the issue closes when the PR merges, which requires `ci:test` fully green.

    - type: textarea
      id: goal
      attributes:
          label: "Goal"
          description: "What should be achieved? State observable behavior, not implementation."
          placeholder: |
              Example:
              - Parse BigTIFF SRATIONAL values correctly (including sign)
              - Throw BoundsError on truncated IFD entry
      validations:
          required: true

    - type: textarea
      id: scope
      attributes:
          label: "Allowed file scope"
          description: "List the ONLY files/paths the agent may modify. If more are needed, the agent must STOP."
          placeholder: |
              Example:
              - src/Parse/Tiff/TiffValueReader.php
              - tests/Parse/Tiff/TiffValueReaderTest.php
      validations:
          required: true

    - type: textarea
      id: specs
      attributes:
          label: "Specs to consult (docs/)"
          description: "Point to relevant HTML/PDF specs under docs/. Include chapter/section if known."
          placeholder: |
              Example:
              - docs/EXIF-310.pdf (EXIF 3.1 §4.6.4)
              - docs/EXIF-300.pdf (EXIF 3.0 §...)
              - docs/TIFF6.pdf (TIFF 6.0 §...)
              - docs/ISO_IEC_14496-12_2015.pdf (ISO BMFF §...)
              - docs/Quicktime-File-Format-2012.pdf (QuickTime §...)
      validations:
          required: false

    - type: textarea
      id: acceptance
      attributes:
          label: "Acceptance criteria (AC)"
          description: "Concrete pass/fail criteria."
          placeholder: |
              Example:
              - PHPUnit green
              - At least 1 positive + 1 negative test (ParseError/BoundsError) where applicable
              - Spec references added near changed parser code (EXIF <version> §<chapter>)
              - No full reads; streaming preserved; bounds & max limits enforced
      validations:
          required: true

    - type: textarea
      id: tests_required
      attributes:
          label: "Tests (what to add/adjust)"
          description: "Describe minimal test cases. If tests-only, say so."
          placeholder: |
              Example:
              - Add test: itThrowsBoundsErrorOnTruncatedIfdEntry
              - Add test: itParsesBigTiffSrationalCorrectly
              - Use synthetic streams/blobs (no large fixtures)
      validations:
          required: false

    - type: textarea
      id: risks
      attributes:
          label: "Risks / notes"
          description: "Anything security/bounds-sensitive or tricky."
          placeholder: |
              Example:
              - Bounds/offset sensitive: reject malformed input early
              - Spec ambiguity: propose interpretations and STOP for guidance
      validations:
          required: false
