name: Issue templates

# yamllint (in security.yml) checks the YAML syntax of these files, but not that
# they are valid GitHub issue forms or that the labels they declare exist. A
# structurally wrong form is rejected by github.com at render time with no CI
# signal, and an unresolvable label is dropped silently — so this job validates
# both. It runs on every push and pull request (no path filter) so it can be a
# required status check without leaving template-free PRs stuck on a missing one.

on:
    push:
        branches: [main, master]
    pull_request:

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install check-jsonschema
              run: pipx install 'check-jsonschema==0.37.4'

            - name: Validate issue forms against the schema
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  status=0
                  for file in .github/ISSUE_TEMPLATE/*.yml; do
                      if [ "$(basename "$file")" = 'config.yml' ]; then
                          schema='.github/ISSUE_TEMPLATE/schemas/github-issue-config.json'
                      else
                          schema='.github/ISSUE_TEMPLATE/schemas/github-issue-forms.json'
                      fi
                      echo "::group::$file"
                      check-jsonschema --schemafile "$schema" "$file" || status=1
                      echo '::endgroup::'
                  done
                  exit "$status"

            - name: Assert the agent task form declares no labels
              run: |
                  set -euo pipefail
                  file='.github/ISSUE_TEMPLATE/9-agent-task.yml'
                  # A form applies its declared labels on submission whoever
                  # submits, so a label on this form would be an author's own
                  # claim that the task is ready to implement. The omission is a
                  # trust boundary, not an inconsistency with the other forms.
                  if [ "$(yq -r '[.labels[]?] | length' "$file")" != '0' ]; then
                      echo "::error file=$file::this form must declare no labels — a form-applied label is settable by the issue author and must never carry maintainer intent"
                      exit 1
                  fi

            - name: Assert declared labels are on the allow-list
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  # Compare against the committed allow-list, not the live label
                  # set: a rename/removal elsewhere must not red-fail an
                  # unrelated push, and a drift is caught in the diff that adds
                  # the label. Strip comments and blanks to the bare names.
                  # A missing list is a loud, distinct failure; an empty one (only
                  # comments) must fall through so every declared label is rejected
                  # with an annotation, not abort the step bare on grep's exit 1.
                  [ -f .github/ISSUE_TEMPLATE/allowed-labels.txt ] || {
                      echo '::error::.github/ISSUE_TEMPLATE/allowed-labels.txt is missing'
                      exit 1
                  }
                  allowed="$(grep -v '^[[:space:]]*#' .github/ISSUE_TEMPLATE/allowed-labels.txt | grep -v '^[[:space:]]*$' || true)"
                  status=0
                  for file in .github/ISSUE_TEMPLATE/*.yml; do
                      [ "$(basename "$file")" = 'config.yml' ] && continue
                      # Capture yq first so its exit status is checked — a parse
                      # failure inside a `< <(…)` process substitution is
                      # invisible to `set -e` and would skip the file silently.
                      labels="$(yq -r '.labels[]?' "$file")" || {
                          echo "::error file=$file::could not parse the labels key"
                          status=1
                          continue
                      }
                      while IFS= read -r label; do
                          [ -z "$label" ] && continue
                          if ! grep -qxF "$label" <<<"$allowed"; then
                              echo "::error file=$file::declared label '$label' is not on .github/ISSUE_TEMPLATE/allowed-labels.txt — add it there in this PR if the label is intended"
                              status=1
                          fi
                      done <<<"$labels"
                  done
                  exit "$status"
