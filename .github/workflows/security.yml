name: Security

on:
    push:
        branches: [main, master]
    pull_request:
    schedule:
        - cron: '27 3 * * 1'

permissions:
    contents: read

jobs:
    code-scanning:
        uses: magicsunday/.github/.github/workflows/code-scanning.yml@main
        permissions:
            contents: read
            security-events: write
        with:
            # Vendored specification documents; several exceed the engine's
            # default 1 MB target limit, so without this the scan would report
            # them as files it was given and could not read.
            excludes: docs

    zizmor:
        uses: magicsunday/.github/.github/workflows/zizmor.yml@main
        permissions:
            contents: read
            security-events: write

    scorecard:
        # Scorecard publishes against the default branch; skip pull-request runs.
        if: github.event_name != 'pull_request'
        uses: magicsunday/.github/.github/workflows/scorecard.yml@main
        permissions:
            contents: read
            security-events: write
            id-token: write

    dependency-review:
        # The dependency-review action only runs in a pull-request context.
        if: github.event_name == 'pull_request'
        uses: magicsunday/.github/.github/workflows/dependency-review.yml@main
        permissions:
            contents: read
            pull-requests: write

    yamllint:
        uses: magicsunday/.github/.github/workflows/yamllint.yml@main
        permissions:
            contents: read
        with:
            paths: '.github/workflows/ .github/ISSUE_TEMPLATE/ .github/dependabot.yml .github/zizmor.yml'
