name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: [8.4]

        steps:
            - name: Checkout repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: ctype, date, fileinfo, hash, iconv, json, pcre, xmlreader, yaml
                  tools: composer:v2

            - name: Validate composer.json and composer.lock
              run: composer validate

            - name: Get composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-${{ matrix.php }}-composer-

            - name: Install dependencies
              run: |
                  composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

            - name: Lint
              if: ${{ success() }}
              run: composer ci:test:php:lint

            - name: CGL
              if: ${{ success() }}
              run: composer ci:test:php:cgl

            - name: Rector
              if: ${{ success() }}
              run: composer ci:test:php:rector

            - name: PHPStan
              if: ${{ success() }}
              run: composer ci:test:php:phpstan -- --error-format=table

            - name: PHPUnit Tests
              if: ${{ success() }}
              run: composer ci:test:php:unit

            - name: Copy-Paste Detection
              if: ${{ success() }}
              run: composer ci:test:php:cpd
