name: CI

on:
    push:
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                # PHP 8.4 is preferred but allow 8.3 for CI compatibility
                # until PHP 8.4 is widely available in standard CI environments
                php: [ 8.3, 8.4 ]

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v6

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: ctype, date, fileinfo, hash, iconv, json, pcre, xmlreader, yaml
                    tools: composer:v2

            -   name: Validate composer.json
                run: composer validate --no-check-lock

            -   name: Get composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            -   uses: actions/cache@v5
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: ${{ runner.os }}-${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}
                    restore-keys: |
                        ${{ runner.os }}-${{ matrix.php }}-composer-

            -   name: Install dependencies
                run: |
                    composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

            -   name: Lint
                if: ${{ success() }}
                run: composer ci:test:php:lint

            -   name: CGL
                if: ${{ success() }}
                run: composer ci:test:php:cgl

            -   name: Rector
                if: ${{ success() }}
                run: composer ci:test:php:rector

            -   name: PHPStan
                if: ${{ success() }}
                run: composer ci:test:php:phpstan -- --error-format=table

            -   name: PHPUnit Tests
                if: ${{ success() }}
                run: composer ci:test:php:unit

            -   name: Copy-Paste Detection
                if: ${{ success() }}
                run: composer ci:test:php:cpd
