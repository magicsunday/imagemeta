name: CI

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: [ '8.4' ]

        steps:
            -   id: checkout
                name: Checkout
                uses: actions/checkout@v4

            -   id: setup_php
                name: Set up PHP version ${{ matrix.php }}
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: ctype, date, fileinfo, hash, iconv, json, pcre, xmlreader
                    tools: composer:v2
                    coverage: xdebug

            -   name: Validate composer.json and composer.lock
                run: composer validate

            -   id: composer-cache-vars
                name: Composer Cache Vars
                run: |
                    echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
                    echo "timestamp=$(date +"%s")" >> $GITHUB_OUTPUT

            -   id: composer-cache-dependencies
                name: Cache Composer dependencies
                uses: actions/cache@v4
                with:
                    path: ${{ steps.composer-cache-vars.outputs.dir }}
                    key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ steps.composer-cache-vars.outputs.timestamp }}
                    restore-keys: |
                        ${{ runner.os }}-composer-${{ matrix.php }}-
                        ${{ runner.os }}-composer-

            -   id: install
                name: Install dependencies
                run: |
                    composer validate
                    composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader

            -   id: lint
                name: Lint
                if: ${{ always() && steps.install.conclusion == 'success' }}
                run: |
                    composer ci:test:php:lint

            -   id: cgl
                name: CGL
                if: ${{ always() && steps.install.conclusion == 'success' }}
                run: |
                    composer ci:test:php:cgl

            -   id: phpstan
                name: PHPStan
                if: ${{ always() && steps.install.conclusion == 'success' }}
                run: |
                    composer ci:test:php:phpstan

            -   id: rector
                name: Rector
                if: ${{ always() && steps.install.conclusion == 'success' }}
                run: |
                    composer ci:test:php:rector

            -   id: cpd
                name: Copy-Paste Detection
                if: ${{ always() && steps.install.conclusion == 'success' }}
                run: |
                    composer ci:test:php:cpd

            -   id: tests
                name: PHPUnit Tests
                if: ${{ always() && steps.install.conclusion == 'success' }}
                run: |
                    composer ci:test:php:unit

            -   id: coverage
                name: Generate Coverage
                if: ${{ always() && steps.tests.conclusion == 'success' }}
                run: |
                    mkdir -p .build/coverage
                    XDEBUG_MODE=coverage .build/bin/phpunit --configuration .build/phpunit.xml --coverage-cobertura .build/coverage/cobertura.xml --coverage-html .build/coverage/html --coverage-text | tee .build/coverage/coverage.txt

            -   id: extract-coverage
                name: Extract coverage percentage
                if: ${{ always() && steps.coverage.conclusion == 'success' }}
                run: |
                    COVERAGE=$(grep -oP 'Lines:\s+\K[\d.]+(?=%)' .build/coverage/coverage.txt | head -1)
                    echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
                    echo "Coverage: $COVERAGE%"

            -   id: create-coverage-badge
                name: Create coverage badge
                if: ${{ always() && steps.extract-coverage.conclusion == 'success' && github.ref == 'refs/heads/main' }}
                uses: schneegans/dynamic-badges-action@v1.7.0
                with:
                    auth: ${{ secrets.GIST_SECRET }}
                    gistID: ${{ secrets.GIST_ID }}
                    filename: imagemeta-coverage.json
                    label: coverage
                    message: ${{ env.COVERAGE }}%
                    color: ${{ env.COVERAGE > 90 && 'brightgreen' || env.COVERAGE > 80 && 'green' || env.COVERAGE > 70 && 'yellowgreen' || env.COVERAGE > 60 && 'yellow' || env.COVERAGE > 50 && 'orange' || 'red' }}

            -   id: upload-coverage-artifact
                name: Upload coverage HTML report
                if: ${{ always() && steps.coverage.conclusion == 'success' }}
                uses: actions/upload-artifact@v4
                with:
                    name: coverage-report
                    path: .build/coverage/html
                    retention-days: 30

            -   id: coverage-summary
                name: Add coverage summary to job
                if: ${{ always() && steps.coverage.conclusion == 'success' }}
                run: |
                    echo "## Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
                    echo "" >> $GITHUB_STEP_SUMMARY
                    echo "Coverage report has been generated and uploaded as an artifact." >> $GITHUB_STEP_SUMMARY
                    echo "" >> $GITHUB_STEP_SUMMARY
                    echo "You can download the full HTML coverage report from the workflow artifacts." >> $GITHUB_STEP_SUMMARY
                    echo "" >> $GITHUB_STEP_SUMMARY
                    echo "### Coverage details:" >> $GITHUB_STEP_SUMMARY
                    echo '```' >> $GITHUB_STEP_SUMMARY
                    grep -A 10 "Code Coverage Report:" .build/coverage/coverage.txt >> $GITHUB_STEP_SUMMARY || true
                    echo '```' >> $GITHUB_STEP_SUMMARY
