name: CI

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: [ '8.4' ]

        steps:
            -   id: checkout
                name: Checkout
                uses: actions/checkout@v4

            -   id: setup_php
                name: Set up PHP version ${{ matrix.php }}
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: ctype, date, fileinfo, hash, iconv, json, pcre, xmlreader, yaml
                    tools: composer:v2

            -   name: Validate composer.json and composer.lock
                run: composer validate

            -   id: composer-cache-vars
                name: Composer Cache Vars
                run: |
                    echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
                    echo "timestamp=$(date +"%s")" >> $GITHUB_OUTPUT

            -   id: composer-cache-dependencies
                name: Cache Composer dependencies
                uses: actions/cache@v4
                with:
                    path: ${{ steps.composer-cache-vars.outputs.dir }}
                    key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ steps.composer-cache-vars.outputs.timestamp }}
                    restore-keys: |
                        ${{ runner.os }}-composer-${{ matrix.php }}-
                        ${{ runner.os }}-composer-

            -   id: install
                name: Install dependencies
                run: |
                    composer validate
                    composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader

            -   id: lint
                name: Lint
                if: ${{ always() && steps.install.conclusion == 'success' }}
                run: |
                    composer ci:test:php:lint

            -   id: cgl
                name: CGL
                if: ${{ always() && steps.install.conclusion == 'success' }}
                run: |
                    composer ci:test:php:cgl

            -   id: phpstan
                name: PHPStan
                if: ${{ always() && steps.install.conclusion == 'success' }}
                run: |
                    composer ci:test:php:phpstan

            -   id: rector
                name: Rector
                if: ${{ always() && steps.install.conclusion == 'success' }}
                run: |
                    composer ci:test:php:rector

            -   id: cpd
                name: Copy-Paste Detection
                if: ${{ always() && steps.install.conclusion == 'success' }}
                run: |
                    composer ci:test:php:cpd

            -   id: tests
                name: PHPUnit Tests
                if: ${{ always() && steps.install.conclusion == 'success' }}
                run: |
                    composer ci:test:php:unit

            -   id: compliance
                name: EXIF/TIFF Compliance Analysis
                if: ${{ always() && steps.install.conclusion == 'success' }}
                run: |
                    php scripts/analyze-exif-compliance.php 50

            -   name: Upload Compliance Report
                uses: actions/upload-artifact@v4
                if: always()
                with:
                    name: compliance-report-php-${{ matrix.php }}
                    path: |
                        docs/compliance-report.json
                        docs/compliance-report.yaml
                    retention-days: 30
