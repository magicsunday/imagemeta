name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: [ 8.4 ]

        steps:
            -   name: Checkout repository
                uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            -   name: Setup PHP
                uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: ctype, date, fileinfo, hash, iconv, json, pcre, xmlreader, yaml
                    tools: composer:v2

            -   name: Validate composer.json and composer.lock
                run: composer validate

            -   name: Get composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            -   uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: ${{ runner.os }}-${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}
                    restore-keys: |
                        ${{ runner.os }}-${{ matrix.php }}-composer-

            -   name: Install dependencies
                run: |
                    composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

            -   name: Lint
                if: ${{ success() }}
                run: composer ci:test:php:lint

            -   name: CGL
                if: ${{ success() }}
                run: composer ci:test:php:cgl

            -   name: Rector
                if: ${{ success() }}
                run: composer ci:test:php:rector

            -   name: PHPStan
                if: ${{ success() }}
                run: composer ci:test:php:phpstan -- --error-format=table

            -   name: PHPUnit Tests
                if: ${{ success() }}
                run: composer ci:test:php:unit

            -   name: Copy-Paste Detection
                if: ${{ success() }}
                run: composer ci:test:php:cpd
