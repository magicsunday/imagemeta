# Architecture layers for magicsunday/imagemeta.
#
# The canonical layer definitions and ruleset come from the shared coding-standard import.
# In this package they collect src/Model and src/Exif/Model (Model), src/Contract (Contract),
# src/Value/Enum (Enum) and src/MakerNotes/Support plus src/MakerNotes/Apple/Support (Support).
#
# The package-local layers below are anchored to their top-level namespace and skip those nested
# canonical directories, so every class lands in exactly one layer. Core (src/Core, the byte-level
# foundation) is a leaf every layer may use; Entry is the MetadataReader entry point at the src
# root. Their rulesets encode the boundaries of AGENTS.md §5.5 and §5.7:
#
#   - nothing outside Factory may depend on Parse (Parse holds streaming input, not typed output);
#   - Model and Parse must not depend on Factory (models hold data, parsers parse, factories create);
#   - Detect must not depend on Model (it identifies containers by signature, not by data).
#
# Deptrac rulesets are allow-lists, so each local layer lists every layer it may reach; a
# boundary is the layer that is missing from the list. A layer may always depend on itself.

imports:
    - .build/vendor/magicsunday/coding-standard/deptrac/layers.yaml

deptrac:
    paths:
        - src

    layers:
        -
            name: Core
            collectors:
                -
                    type: directory
                    value: 'src/Core/.*'
        -
            name: Entry
            collectors:
                -
                    type: classNameRegex
                    value: '#^MagicSunday\\ImageMeta\\MetadataReader$#'
        -
            name: Parse
            collectors:
                -
                    type: directory
                    value: 'src/Parse/.*'
        -
            name: Factory
            collectors:
                -
                    type: directory
                    value: 'src/Factory/.*'
        -
            name: Detect
            collectors:
                -
                    type: directory
                    value: 'src/Detect/.*'
        -
            name: Convenience
            collectors:
                -
                    type: directory
                    value: 'src/Convenience/.*'
        -
            name: Exif
            collectors:
                -
                    type: directory
                    value: 'src/Exif/(?!Model/).*'
        -
            name: Value
            collectors:
                -
                    type: directory
                    value: 'src/Value/(?!Enum/).*'
        -
            name: MakerNotes
            collectors:
                -
                    type: directory
                    value: 'src/MakerNotes/(?!(.*/)?Support/).*'

    ruleset:
        # Core is the byte-level foundation (streams, readers, errors, utilities) every
        # other layer builds on; it depends on no other layer of this package.
        Core: ~
        # Entry: MetadataReader, the package's public entry point at the src root, composes
        # the factories, parsers and detectors.
        Entry:
            - Core
            - Enum
            - Model
            - Contract
            - Support
            - Factory
            - Parse
            - Detect
            - Exif
            - Value
            - MakerNotes
        Parse:
            - Core
            - Enum
            - Model
            - Contract
            - Support
            - Detect
            - Convenience
            - Exif
            - Value
            - MakerNotes
        Factory:
            - Core
            - Enum
            - Model
            - Contract
            - Support
            - Parse
            - Detect
            - Convenience
            - Exif
            - Value
            - MakerNotes
        Detect:
            - Core
            - Enum
            - Contract
            - Support
            - Factory
            - Convenience
            - Exif
            - Value
            - MakerNotes
        Convenience:
            - Core
            - Entry
            - Enum
            - Model
            - Contract
            - Support
            - Factory
            - Detect
            - Exif
            - Value
            - MakerNotes
        Exif:
            - Core
            - Enum
            - Model
            - Contract
            - Support
            - Factory
            - Detect
            - Convenience
            - Value
            - MakerNotes
        Value:
            - Core
            - Enum
            - Model
            - Contract
            - Support
            - Factory
            - Detect
            - Convenience
            - Exif
            - MakerNotes
        MakerNotes:
            - Core
            - Enum
            - Model
            - Contract
            - Support
            - Factory
            - Detect
            - Convenience
            - Exif
            - Value

        # Package-local widenings of the shared canonical layers. Deptrac unites these with the
        # imported ruleset, so they only add edges. Parse and Factory stay off every list;
        # Core is on every list, because every layer reads bytes or raises its errors.
        #
        # Model: Metadata exposes Exif, maker-note and value objects plus the QuickTimeLookup
        # view (MakerNotes\Apple\Support) as its public read API.
        Model:
            - Core
            - Exif
            - MakerNotes
            - Support
            - Value
        # Enum: the enums under Value\Enum return and accept value objects from Value.
        Enum:
            - Core
            - Value
        # Support: the maker-note field readers (MakerNotes\Support) decode through Core.
        Support:
            - Core
        # Contract: TiffExifParserInterface takes the maker-note Registry.
        Contract:
            - Core
            - MakerNotes
