gps_tags:
  # GPS IFD Tags (EXIF 2.32 / 3.0)
  0x0000:
    name: GPSVersionID
    type: BYTE
    count: 4
    ifd: GPSIFD
    source: EXIF 2.32
    required: true
    description: GPS tag version

  0x0001:
    name: GPSLatitudeRef
    type: ASCII
    count: 2
    ifd: GPSIFD
    source: EXIF 2.32
    description: North or South latitude

  0x0002:
    name: GPSLatitude
    type: RATIONAL
    count: 3
    ifd: GPSIFD
    source: EXIF 2.32
    description: Latitude

  0x0003:
    name: GPSLongitudeRef
    type: ASCII
    count: 2
    ifd: GPSIFD
    source: EXIF 2.32
    description: East or West longitude

  0x0004:
    name: GPSLongitude
    type: RATIONAL
    count: 3
    ifd: GPSIFD
    source: EXIF 2.32
    description: Longitude

  0x0005:
    name: GPSAltitudeRef
    type: BYTE
    count: 1
    ifd: GPSIFD
    source: EXIF 2.32
    description: Altitude reference

  0x0006:
    name: GPSAltitude
    type: RATIONAL
    count: 1
    ifd: GPSIFD
    source: EXIF 2.32
    description: Altitude

  0x0007:
    name: GPSTimeStamp
    type: RATIONAL
    count: 3
    ifd: GPSIFD
    source: EXIF 2.32
    description: GPS time (atomic clock)

  0x0008:
    name: GPSSatellites
    type: ASCII
    count: any
    ifd: GPSIFD
    source: EXIF 2.32
    description: GPS satellites used

  0x0009:
    name: GPSStatus
    type: ASCII
    count: 2
    ifd: GPSIFD
    source: EXIF 2.32
    description: GPS receiver status

  0x000A:
    name: GPSMeasureMode
    type: ASCII
