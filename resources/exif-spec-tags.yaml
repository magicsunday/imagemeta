# Official EXIF and TIFF tag specifications
# Sources: EXIF 3.0, EXIF 2.32, TIFF 6.0
# This file serves as the reference for compliance analysis

tiff_tags:
  # TIFF 6.0 Baseline Tags
  0x00FE:
    name: NewSubfileType
    type: LONG
    count: 1
    ifd: IFD0
    source: TIFF 6.0
    required: false
    description: Subfile type indicator

  0x00FF:
    name: SubfileType
    type: SHORT
    count: 1
    ifd: IFD0
    source: TIFF 5.0
    deprecated: true
    description: Legacy subfile type

  0x0100:
    name: ImageWidth
    type: SHORT|LONG
    count: 1
    ifd: IFD0
    source: TIFF 6.0
    required: true
    description: Image width in pixels

  0x0101:
    name: ImageLength
    type: SHORT|LONG
    count: 1
    ifd: IFD0
    source: TIFF 6.0
    required: true
    description: Image height in pixels

  0x0102:
    name: BitsPerSample
    type: SHORT
    count: SamplesPerPixel
    ifd: IFD0
    source: TIFF 6.0
    default: 1
    description: Bits per color component

  0x0103:
    name: Compression
    type: SHORT
    count: 1
    ifd: IFD0
    source: TIFF 6.0
    default: 1
    description: Compression scheme

  0x0106:
    name: PhotometricInterpretation
    type: SHORT
    count: 1
    ifd: IFD0
    source: TIFF 6.0
    required: true
    description: Color space of image data

  0x010D:
    name: DocumentName
    type: ASCII
    count: any
    ifd: IFD0
    source: TIFF 6.0
    description: Name of document from which image was scanned

  0x010E:
    name: ImageDescription
    type: ASCII
    count: any
    ifd: IFD0
    source: TIFF 6.0
    description: Image title or description

  0x010F:
    name: Make
    type: ASCII
    count: any
    ifd: IFD0
    source: TIFF 6.0
    description: Manufacturer of recording equipment

  0x0110:
    name: Model
    type: ASCII
    count: any
    ifd: IFD0
    source: TIFF 6.0
    description: Model name or number of equipment

  0x0111:
    name: StripOffsets
    type: SHORT|LONG
    count: StripsPerImage
    ifd: IFD0
    source: TIFF 6.0
    required: conditional
    description: Byte offsets to strips

  0x0112:
    name: Orientation
    type: SHORT
    count: 1
    ifd: IFD0
    source: TIFF 6.0
    default: 1
    description: Image orientation

  0x0115:
    name: SamplesPerPixel
    type: SHORT
    count: 1
    ifd: IFD0
    source: TIFF 6.0
    default: 1
    description: Number of components per pixel

  0x0116:
    name: RowsPerStrip
    type: SHORT|LONG
    count: 1
    ifd: IFD0
    source: TIFF 6.0
    default: 2^32-1
    description: Number of rows per strip

  0x0117:
    name: StripByteCounts
    type: SHORT|LONG
    count: StripsPerImage
    ifd: IFD0
    source: TIFF 6.0
    required: conditional
    description: Bytes per compressed strip

  0x011A:
    name: XResolution
    type: RATIONAL
    count: 1
    ifd: IFD0
    source: TIFF 6.0
    required: conditional
    description: Horizontal resolution

  0x011B:
    name: YResolution
    type: RATIONAL
    count: 1
    ifd: IFD0
    source: TIFF 6.0
    required: conditional
    description: Vertical resolution

  0x011C:
    name: PlanarConfiguration
    type: SHORT
    count: 1
    ifd: IFD0
    source: TIFF 6.0
    default: 1
    description: Pixel component organization

  0x0128:
    name: ResolutionUnit
    type: SHORT
    count: 1
    ifd: IFD0
    source: TIFF 6.0
    default: 2
    description: Unit for XResolution and YResolution

  0x012D:
    name: TransferFunction
    type: SHORT
    count: 3*256
    ifd: IFD0
    source: TIFF 6.0
    description: Transfer function for image

  0x0131:
    name: Software
    type: ASCII
    count: any
    ifd: IFD0
    source: TIFF 6.0
    description: Software used to create image

  0x0132:
    name: DateTime
    type: ASCII
    count: 20
    ifd: IFD0
    source: TIFF 6.0
    description: File change date and time

  0x013B:
    name: Artist
    type: ASCII
    count: any
    ifd: IFD0
    source: TIFF 6.0
    description: Person who created the image

  0x013C:
    name: HostComputer
    type: ASCII
    count: any
    ifd: IFD0
    source: TIFF 6.0
    description: Computer/OS used to create image

  0x013E:
    name: WhitePoint
    type: RATIONAL
    count: 2
    ifd: IFD0
    source: TIFF 6.0
    description: Chromaticity of white point

  0x013F:
    name: PrimaryChromaticities
    type: RATIONAL
    count: 6
    ifd: IFD0
    source: TIFF 6.0
    description: Chromaticities of primaries

  0x0142:
    name: TileWidth
    type: SHORT|LONG
    count: 1
    ifd: IFD0
    source: TIFF 6.0
    description: Tile width in pixels

  0x0143:
    name: TileLength
    type: SHORT|LONG
    count: 1
    ifd: IFD0
    source: TIFF 6.0
    description: Tile height in pixels

  0x0144:
    name: TileOffsets
    type: LONG
    count: TilesPerImage
    ifd: IFD0
    source: TIFF 6.0
    description: Offsets to data tiles

  0x0145:
    name: TileByteCounts
    type: SHORT|LONG
    count: TilesPerImage
    ifd: IFD0
    source: TIFF 6.0
    description: Byte counts for tiles

  0x014A:
    name: SubIFDs
    type: IFD
    count: any
    ifd: IFD0
    source: TIFF Tech Note 1
    description: Offset to child IFDs

  0x0201:
    name: JPEGInterchangeFormat
    type: LONG
    count: 1
    ifd: IFD1
    source: TIFF 6.0
    description: Offset to JPEG SOI marker

  0x0202:
    name: JPEGInterchangeFormatLength
    type: LONG
    count: 1
    ifd: IFD1
    source: TIFF 6.0
    description: Bytes of JPEG data

  0x0211:
    name: YCbCrCoefficients
    type: RATIONAL
    count: 3
    ifd: IFD0
    source: TIFF 6.0
    description: Matrix coefficients for RGB to YCbCr

  0x0212:
    name: YCbCrSubSampling
    type: SHORT
    count: 2
    ifd: IFD0
    source: TIFF 6.0
    default: [2, 2]
    description: Subsampling ratio of Y to Cb/Cr

  0x0213:
    name: YCbCrPositioning
    type: SHORT
    count: 1
    ifd: IFD0
    source: TIFF 6.0
    default: 1
    description: Positioning of subsampled chrominance

  0x0214:
    name: ReferenceBlackWhite
    type: RATIONAL
    count: 6
    ifd: IFD0
    source: TIFF 6.0
    description: Pair of headroom and footroom values

  0x8298:
    name: Copyright
    type: ASCII
    count: any
    ifd: IFD0
    source: TIFF 6.0
    description: Copyright notice

  0x000B:
    name: ProcessingSoftware
    type: ASCII
    count: any
    ifd: IFD0
    source: EXIF 3.0
    description: Software used for image processing

exif_tags:
  # EXIF 2.32 / 3.0 Tags
  0x829A:
    name: ExposureTime
    type: RATIONAL
    count: 1
    ifd: ExifIFD
    source: EXIF 2.32
    description: Exposure time in seconds

  0x829D:
    name: FNumber
    type: RATIONAL
    count: 1
    ifd: ExifIFD
    source: EXIF 2.32
    description: F number

  0x8822:
    name: ExposureProgram
    type: SHORT
    count: 1
    ifd: ExifIFD
    source: EXIF 2.32
    description: Exposure program mode

  0x8824:
    name: SpectralSensitivity
    type: ASCII
    count: any
    ifd: ExifIFD
    source: EXIF 2.32
    description: Spectral sensitivity of sensor

  0x8827:
    name: PhotographicSensitivity
    type: SHORT
    count: any
    ifd: ExifIFD
    source: EXIF 2.32
    description: ISO speed rating

  0x8828:
    name: OECF
    type: UNDEFINED
    count: any
    ifd: ExifIFD
    source: EXIF 2.32
    description: Opto-Electric Conversion Function

  0x8830:
    name: SensitivityType
    type: SHORT
    count: 1
    ifd: ExifIFD
    source: EXIF 2.32
    description: Type of sensitivity value

  0x8831:
    name: StandardOutputSensitivity
    type: LONG
    count: 1
    ifd: ExifIFD
    source: EXIF 2.32
    description: Standard output sensitivity

  0x8832:
    name: RecommendedExposureIndex
    type: LONG
    count: 1
    ifd: ExifIFD
    source: EXIF 2.32
    description: Recommended exposure index

  0x8833:
    name: ISOSpeed
    type: LONG
    count: 1
    ifd: ExifIFD
    source: EXIF 2.32
    description: ISO speed value

  0x8834:
    name: ISOSpeedLatitudeyyy
    type: LONG
    count: 1
    ifd: ExifIFD
    source: EXIF 2.32
    description: ISO speed latitude yyy

  0x8835:
    name: ISOSpeedLatitudezzz
    type: LONG
    count: 1
    ifd: ExifIFD
    source: EXIF 2.32
    description: ISO speed latitude zzz

  0x9000:
    name: ExifVersion
    type: UNDEFINED
    count: 4
    ifd: ExifIFD
    source: EXIF 2.32
    required: true
    description: EXIF version

  0x9003:
    name: DateTimeOriginal
    type: ASCII
    count: 20
    ifd: ExifIFD
    source: EXIF 2.32
    description: Date/time of original image

  0x9004:
    name: DateTimeDigitized
    type: ASCII
    count: 20
    ifd: ExifIFD
    source: EXIF 2.32
    description: Date/time of digitization

  0x9010:
    name: OffsetTime
    type: ASCII
    count: 7
    ifd: ExifIFD
    source: EXIF 2.32
    description: Offset from UTC for DateTime

  0x9011:
    name: OffsetTimeOriginal
    type: ASCII
    count: 7
    ifd: ExifIFD
    source: EXIF 2.32
    description: Offset from UTC for DateTimeOriginal

  0x9012:
    name: OffsetTimeDigitized
    type: ASCII
    count: 7
    ifd: ExifIFD
    source: EXIF 2.32
    description: Offset from UTC for DateTimeDigitized

  0x9101:
    name: ComponentsConfiguration
    type: UNDEFINED
    count: 4
    ifd: ExifIFD
    source: EXIF 2.32
    required: true
    description: Meaning of each component

  0x9102:
    name: CompressedBitsPerPixel
    type: RATIONAL
    count: 1
    ifd: ExifIFD
    source: EXIF 2.32
    description: Compression mode

  0x9201:
    name: ShutterSpeedValue
    type: SRATIONAL
    count: 1
    ifd: ExifIFD
    source: EXIF 2.32
    description: Shutter speed (APEX)

  0x9202:
    name: ApertureValue
    type: RATIONAL
    count: 1
    ifd: ExifIFD
    source: EXIF 2.32
    description: Aperture value (APEX)

  0x9203:
    name: BrightnessValue
    type: SRATIONAL
    count: 1
    ifd: ExifIFD
    source: EXIF 2.32
    description: Brightness (APEX)

  0x9204:
    name: ExposureBiasValue
    type: SRATIONAL
    count: 1
    ifd: ExifIFD
    source: EXIF 2.32
    description: Exposure bias (APEX)

  0x9205:
    name: MaxApertureValue
    type: RATIONAL
    count: 1
    ifd: ExifIFD
    source: EXIF 2.32
    description: Maximum lens aperture (APEX)

  0x9206:
    name: SubjectDistance
    type: RATIONAL
    count: 1
    ifd: ExifIFD
    source: EXIF 2.32
    description: Distance to subject in meters

  0x9207:
    name: MeteringMode
